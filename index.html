<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shan Patel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        cursor: none;
        --c-yellow: #FFD60A;
        --c-blue: #5AC8FA;
        --c-pink: #FF2D55;
        --c-purple: #5856D6;
        --c-black: #1c1c1e;
      }
      body {
        background-color: #FFFDF5; /* Creamy white */
        color: #1c1c1e;
        font-family: 'Fredoka', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Fredoka', sans-serif;
        letter-spacing: -0.02em;
      }
      
      /* Neo-Brutalist Shadow Helper */
      .neo-shadow {
        box-shadow: 4px 4px 0px 0px #000000;
      }
      .neo-shadow-lg {
        box-shadow: 8px 8px 0px 0px #000000;
      }
      .neo-shadow-hover:hover {
        box-shadow: 2px 2px 0px 0px #000000;
        transform: translate(2px, 2px);
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #FFFDF5;
        border-left: 2px solid black;
      }
      ::-webkit-scrollbar-thumb {
        background: #FFD60A;
        border: 2px solid black;
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF2D55;
      }

      .text-outline {
        -webkit-text-stroke: 2px #000000;
        color: transparent;
      }
      
      .text-outline-white {
        -webkit-text-stroke: 4px #000000;
        color: #FFFFFF;
        paint-order: stroke fill;
      }
    </style>

}
